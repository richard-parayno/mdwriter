[package]
name = "mdwriter"
version = "0.1.0"
license = "MIT"
edition = "2021"

[lib]
name = "mdwriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-opener = "2.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
